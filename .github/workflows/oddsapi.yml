name: FanDuel pull (The Odds API)

# 500 free credits a month. One run a day at 17:10 UTC (1:10 PM ET):
#   game lines  h2h + spreads + totals  = 3 credits
#   points props, games tipping within 14 hours = 1 credit per game
# Busiest month (Jan 2027, 236 games) ~ 93 + 236 = ~329 credits.
# The props loop keeps a 60-credit reserve using the API's own
# x-requests-remaining header. Skips itself entirely until the
# ODDS_API_KEY repository secret exists.
on:
  schedule:
    - cron: "10 17 * * *"
  workflow_dispatch: {}

concurrency:
  group: nba-site-repo-write   # shared by every workflow that commits to main
  cancel-in-progress: false    # queue, never kill a run mid-push

permissions:
  contents: write

jobs:
  pull-fanduel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull FanDuel lines and rebuild
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY secret not set; skipping (no credits spent)."
            exit 0
          fi
          python scripts/build.py --no-fetch --pull-lines --pull-props
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "FanDuel pull: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Rebase onto whatever another workflow pushed meanwhile, then push.
          # -X theirs keeps this run's freshly generated files on conflict.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep $((RANDOM % 15 + 5))
          done
          echo "could not push after 5 attempts"; exit 1
