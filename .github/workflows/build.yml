name: Daily build (box scores, rosters, everything)

# sportsdataverse's NBA data job (hoopR-nba-data, daily_nba.yml) starts at
# 07:00 UTC in season. 10:40 UTC leaves a wide margin for it to finish, and
# lands before the West Coast morning. Each build records the box-score
# file's Last-Modified time, shown on Home, so a late upstream run is visible.
on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: nba-site-repo-write   # shared by every workflow that commits to main
  cancel-in-progress: false    # queue, never kill a run mid-push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Heavy build
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # phone alerts (alerts.py); empty = no alerts
        run: python scripts/build.py
      - name: Commit and push (rebuild on top if main moved)
        # alerts_state.json is kept through a rebuild so an alert that already went out isn't sent twice
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: bash scripts/push_or_rebuild.sh "Daily build" "python scripts/build.py" data/alerts_state.json
