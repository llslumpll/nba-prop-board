name: FanDuel pull (The Odds API)

# 500 free credits a month. GitHub runs scheduled jobs late (sometimes hours)
# or skips them, so this tries four times a day. Each attempt is safe:
#   game lines (h2h + spreads + totals, 3 credits) - pulled once per ET day
#   points props, games tipping within 14 hours (1 credit per game) - pulled
#     once per ET day; if FanDuel hasn't posted them yet the attempt costs
#     nothing and the next attempt retries
# Busiest month (Jan 2027, 236 games) ~ 93 + 236 = ~329 credits.
# A manual run from the Actions tab does the same thing.
# Skips itself entirely until the ODDS_API_KEY repository secret exists.
on:
  schedule:
    - cron: "10 13 * * *"   # 9:10 AM ET
    - cron: "10 15 * * *"   # 11:10 AM ET
    - cron: "10 17 * * *"   # 1:10 PM ET
    - cron: "10 20 * * *"   # 4:10 PM ET (late games)
  workflow_dispatch: {}

concurrency:
  group: nba-site-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull-fanduel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull FanDuel lines and rebuild
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY secret not set; skipping (no credits spent)."
            exit 0
          fi
          python scripts/build.py --no-fetch --fanduel-daily
      - name: Commit and push (rebuild on top if main moved)
        run: bash scripts/push_or_rebuild.sh "FanDuel pull" "python scripts/build.py --no-fetch" data/oddsapi_lines.json data/oddsapi_props.json data/oddsapi_usage_log.json
